; SmartMeet deploy config
; Change network.active_profile to switch between local and cloud
; Optional env overrides:
;   SMARTMEET_CONFIG=<custom ini path>
;   SMARTMEET_PROFILE=local or cloud

[network]
active_profile=cloud

[profile.local]
signal_url=ws://127.0.0.1:9001
rtmp_publish_base=rtmp://127.0.0.1/live
rtmp_play_base=rtmp://127.0.0.1/live

[profile.cloud]
signal_url=ws://8.134.203.85:9001
rtmp_publish_base=rtmp://8.134.203.85/live
rtmp_play_base=rtmp://8.134.203.85/live

[ai]
enabled=true
service_url=http://127.0.0.1:18080
timeout_ms=600000
assistant_name=AI助手
