; SmartMeet deploy config
; Change network.active_profile to switch between local and cloud
; Optional env overrides:
;   SMARTMEET_CONFIG=<custom ini path>
;   SMARTMEET_PROFILE=local or cloud

[network]
active_profile=cloud

[profile.local]
signal_url=ws://127.0.0.1:9001
rtmp_publish_base=rtmp://127.0.0.1/live
rtmp_play_base=rtmp://127.0.0.1/live

[profile.cloud]
signal_url=ws://8.166.132.119:9001
rtmp_publish_base=rtmp://8.166.132.119/live
rtmp_play_base=rtmp://8.166.132.119/live

[ai]
enabled=true
service_url=http://127.0.0.1:18080
timeout_ms=600000
assistant_name=AI助手
virtual_bg_enabled=false
virtual_bg_mode=off
virtual_bg_color=#ddebff
virtual_bg_image=
virtual_bg_blur_strength=45
segment_interval=4
segment_timeout_ms=1500
segment_max_input_side=512
