[assistant]
; 助手显示名称
name=AI助手
; auto=openai兼容模型优先，失败时可回退
; openai_compatible=强制走真实模型
; local=只走本地规则型回答
provider_mode=auto
; 当真实模型失败或超时时，是否回退到本地规则型回答
fallback_to_local=true

[llm]
; 是否启用真实大模型链路
enabled=true
; OpenAI兼容接口基地址
base_url=https://api.deepseek.com
; 建议长期改为环境变量 SMARTMEET_LLM_API_KEY，不建议把真实密钥长期保留在仓库文件中
api_key=xx
; 模型名称
model=deepseek-chat
; 请求超时，单位毫秒。当前为 10 分钟
timeout_ms=600000
; 回答随机性，越低越稳定
temperature=0.2
; 单次回答最大 token 数
max_tokens=800

[segment]
; 是否启用人像分割链路。未放置 ONNX 模型前建议保持 false
enabled=true
; 当前固定为 onnxruntime
backend=onnxruntime
; ONNX 模型路径。相对路径基于 pythonAiService 目录解析
model_path=models/portrait_segmentation.onnx
; PP-HumanSeg 第一版先按 192x192 跑，和官方 demo 更接近
input_width=192
input_height=192
; 二值化阈值，仅在客户端请求 binary mask 时使用
threshold=0.5
; PP-HumanSeg 第一版先按概率图处理，不做 logits sigmoid
output_is_logits=false
; 可选：手动指定 ONNX 输入/输出名字；留空则自动取第一个
input_name=
output_name=
