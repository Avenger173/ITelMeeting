[assistant]
; 助手显示名称
name=AI助手
; auto=优先真实模型，失败时回退
; openai_compatible=强制走真实模型
; local=只走本地规则回答
provider_mode=auto
; 真实模型失败或超时时，是否回退到本地回答
fallback_to_local=true

[llm]
; 是否启用真实大模型
enabled=true
; OpenAI 兼容接口基地址
base_url=https://api.deepseek.com
; 建议长期改为环境变量 SMARTMEET_LLM_API_KEY
api_key=
; 模型名称
model=deepseek-chat
; 请求超时，当前为 10 分钟
timeout_ms=600000
; 越低越稳
temperature=0.2
; 单次回答最大 token
max_tokens=800

[segment]
; A2 人像分割
enabled=true
backend=onnxruntime
model_path=models/portrait_segmentation.onnx
; PP-HumanSeg 第一版先按 192x192
input_width=192
input_height=192
threshold=0.5
; PP-HumanSeg 第一版先按概率图处理，不额外做 logits sigmoid
output_is_logits=false
; 可选：手动指定 ONNX 输入/输出名
input_name=
output_name=

[detect]
; A3 YOLO 检测第一阶段默认先关闭，放好模型后再打开
enabled=true
backend=onnxruntime
; 推荐后续放入 yolo11n.onnx 或等价 YOLO 检测模型
model_path=models/yolo11n.onnx
; 第一版先走 640 方形输入
input_size=640
; 置信度阈值
conf_threshold=0.35
; NMS IoU 阈值
iou_threshold=0.45
; 可选：手动指定 ONNX 输入/输出名
input_name=
output_name=
